steps:
  # Build Next.js Frontend
  - name: 'node:20'
    id: 'install-frontend-deps'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:20'
    id: 'build-frontend'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'NODE_ENV=production'

  # Install Python dependencies for RAG Backend
  - name: 'python:3.11'
    id: 'install-backend-deps'
    dir: 'RAG'
    entrypoint: 'pip'
    args: ['install', '-r', 'requirements.txt', 'fastapi', 'uvicorn']

  # Install Python dependencies for Sentiment Backend
  - name: 'python:3.11'
    id: 'install-sentiment-deps'
    dir: 'sentiment'
    entrypoint: 'pip'
    args: ['install', '-r', 'requirements.txt', 'fastapi', 'uvicorn']

  # Optional: Run tests if you have them
  # - name: 'python:3.11'
  #   id: 'test-backend'
  #   dir: 'RAG'
  #   entrypoint: 'pytest'
  #   args: ['-v']

  # Optional: Lint frontend
  # - name: 'node:20'
  #   id: 'lint-frontend'
  #   dir: 'frontend'
  #   entrypoint: 'npm'
  #   args: ['run', 'lint']

  # Build Backend Docker Image (context = repo root: RAG app in /app/RAG, dashboard script in /app/scripts, sentiment in /app/sentiment)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_BACKEND}:${SHORT_SHA}'
      - '-f'
      - 'RAG/Dockerfile'
      - '.'

  # Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-image'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_BACKEND}:${SHORT_SHA}'

  # Deploy Backend (FastAPI) to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME_BACKEND}'
      - '--image'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_BACKEND}:${SHORT_SHA}'
      - '--platform'
      - 'managed'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-secrets'
      - 'OPENAI_API_KEY=openai-api-key:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_KEY=supabase-key:latest,ASSEMBLYAI_KEY=assemblyai-key:latest,HF_TOKEN=hf-token:latest'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
    env:
      - 'CLOUDSDK_RUN_PLATFORM=managed'

  # Build Sentiment Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-sentiment-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_SENTIMENT}:${SHORT_SHA}'
      - '-f'
      - 'sentiment/Dockerfile'
      - 'sentiment'

  # Push Sentiment Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sentiment-image'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_SENTIMENT}:${SHORT_SHA}'

  # Deploy Sentiment API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-sentiment'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME_SENTIMENT}'
      - '--image'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_SENTIMENT}:${SHORT_SHA}'
      - '--platform'
      - 'managed'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-secrets'
      - 'SUPABASE_URL=supabase-url:latest,SUPABASE_KEY=supabase-key:latest,ASSEMBLYAI_KEY=assemblyai-key:latest,HF_TOKEN=hf-token:latest'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
    env:
      - 'CLOUDSDK_RUN_PLATFORM=managed'

  # Get Backend URLs for frontend configuration
  # In bash -c scripts: use $$ for shell vars and $$(...) for command substitution; ${_VAR} and ${SHORT_SHA} are Cloud Build only.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-backend-urls'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$$(gcloud run services describe ${_SERVICE_NAME_BACKEND} --region=${_REGION} --format='value(status.url)')
        SENTIMENT_URL=$$(gcloud run services describe ${_SERVICE_NAME_SENTIMENT} --region=${_REGION} --format='value(status.url)')
        echo "Backend URL: $$BACKEND_URL"
        echo "Sentiment URL: $$SENTIMENT_URL"
        echo "BACKEND_URL=$$BACKEND_URL" > /workspace/backend-url.env
        echo "SENTIMENT_URL=$$SENTIMENT_URL" >> /workspace/backend-url.env
    env:
      - 'CLOUDSDK_RUN_PLATFORM=managed'

  # Build Frontend Docker Image
  # NEXT_PUBLIC_* values are compiled into the client bundle by `next build`, so they are passed as
  # build args here (backend URLs from the step above, Supabase public config from substitutions).
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        source /workspace/backend-url.env
        if [ -z "$$BACKEND_URL" ] || [ -z "$$SENTIMENT_URL" ]; then
          echo "Backend URLs are empty; cannot build the frontend" >&2
          exit 1
        fi
        if [ -z "${_SUPABASE_PUBLIC_URL}" ] || [ -z "${_SUPABASE_ANON_KEY}" ]; then
          echo "Set the _SUPABASE_PUBLIC_URL and _SUPABASE_ANON_KEY substitutions (Supabase URL and anon key) on the trigger" >&2
          exit 1
        fi
        docker build \
          --build-arg NEXT_PUBLIC_API_URL="$$BACKEND_URL" \
          --build-arg NEXT_PUBLIC_SENTIMENT_API_URL="$$SENTIMENT_URL" \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_SUPABASE_PUBLIC_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${_SUPABASE_ANON_KEY}" \
          -t gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_FRONTEND}:${SHORT_SHA} \
          -f frontend/Dockerfile \
          frontend

  # Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend-image'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_FRONTEND}:${SHORT_SHA}'

  # Deploy Frontend (Next.js) to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Public API/Supabase URLs are baked into the image at build time (see build-frontend-image)
        gcloud run deploy ${_SERVICE_NAME_FRONTEND} \
          --image=gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_FRONTEND}:${SHORT_SHA} \
          --platform=managed \
          --region=${_REGION} \
          --allow-unauthenticated \
          --port=3000 \
          --set-env-vars="NODE_ENV=production" \
          --memory=1Gi \
          --cpu=2 \
          --timeout=300 \
          --max-instances=10
    env:
      - 'CLOUDSDK_RUN_PLATFORM=managed'

# Substitutions for environment variables
substitutions:
  _PROJECT_ID: 'simpliearn-452813'
  _REGION: 'us-central1'
  _SERVICE_NAME_FRONTEND: 'simpli-earn-frontend'
  _SERVICE_NAME_BACKEND: 'simpli-earn-backend'
  _SERVICE_NAME_SENTIMENT: 'simpli-earn-sentiment'
  # Public Supabase config compiled into the frontend (anon key, never the service_role key).
  # Set these on the Cloud Build trigger; the frontend image build fails if they are empty.
  _SUPABASE_PUBLIC_URL: ''
  _SUPABASE_ANON_KEY: ''

# Timeout for the entire build
timeout: '1800s'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Available images (for reference if using Docker builds)
# images:
#   - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_FRONTEND}:${SHORT_SHA}'
#   - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME_BACKEND}:${SHORT_SHA}'

